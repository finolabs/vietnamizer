<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 728" width="960" height="728" role="img" aria-labelledby="self-edit-benchmark-dark-title self-edit-benchmark-dark-desc">
<title id="self-edit-benchmark-dark-title">Kết quả Vietnamizer tự biên tập chính nó, bản 0.16.2</title>
<desc id="self-edit-benchmark-dark-desc">Ba model biên tập bằng Vietnamizer 0.16.2. Lỗi dấu hai chấm giữa câu, bản gốc có 109 chỗ. Sonnet sửa 31 (28%), Gemini 25 (23%), Opus 47 (43%), bản phát hành 49 (45%). Từ ghép bị cắt còn một tiếng như rà, soát, bản gốc có 46 chỗ. Sonnet sửa 0, Gemini 1 (2%), Opus 17 (37%), bản phát hành 17 (37%). Giám khảo Fable 5.2 chọn trên 42 file, Opus 18, giữ bản gốc 16, Sonnet 6, Gemini 2.</desc>
<rect width="100%" height="100%" fill="#1A0A2E"/>
<text x="32" y="34" fill="#BCBCD0" font-size="13" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Cả ba model đều biên tập bằng Vietnamizer 0.16.2. Thanh tô màu là bản phát hành 0.16.2, ghép bản tốt nhất của từng file.</text>
<text x="32" y="74" fill="#F4F1FA" font-size="17" font-weight="600" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Lỗi dấu hai chấm giữa câu mà Vietnamizer giúp từng model phát hiện và sửa</text>
<text x="32" y="96" fill="#BCBCD0" font-size="13" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Bản gốc có 109 chỗ dùng dấu hai chấm nối hai ý trong một câu, kiểu “Khách ít kiên nhẫn: họ sẽ hỏi nơi khác”.</text>
