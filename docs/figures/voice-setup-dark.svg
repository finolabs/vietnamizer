<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="voice-setup-dark-title voice-setup-dark-desc">
<title id="voice-setup-dark-title">Luồng thiết lập giọng của Vietnamizer</title>
<desc id="voice-setup-dark-desc">Năm bước chọn loại giọng, đưa nguồn mẫu, đồng ý đọc, xem hồ sơ nháp và chấm thử dẫn tới câu hỏi bạn có muốn lưu không; có thì hồ sơ được lưu và lần sau gọi bằng tên, không thì hồ sơ chỉ nằm trong cuộc trò chuyện. Dừng ở bước nào cũng không có gì được lưu.</desc>
