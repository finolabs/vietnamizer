<title id="self-edit-benchmark-title">Kết quả Vietnamizer tự biên tập chính nó, bản 0.16.2</title>
<desc id="self-edit-benchmark-desc">Ba model biên tập bằng Vietnamizer 0.16.2. Lỗi dấu hai chấm giữa câu, bản gốc có 109 chỗ. Sonnet sửa 31 (28%), Gemini 25 (23%), Opus 47 (43%), Fable 5.2 chọn và ghép lại 49 (45%). Từ ghép bị cắt còn một tiếng như rà, soát, bản gốc có 46 chỗ. Sonnet sửa 0, Gemini 1 (2%), Opus 17 (37%), Fable 5.2 chọn và ghép lại 17 (37%). Trong 42 file của bản phát hành, 18 file lấy bản của Opus, 6 của Sonnet, 2 của Gemini, 16 giữ bản gốc.</desc>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="32" y="34" fill="#5B5B79" font-size="13" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ba model biên tập bằng Vietnamizer 0.16.2. Thanh tô màu là Fable 5.2 dùng Vietnamizer chọn bản tốt nhất</text>
<text x="32" y="52" fill="#5B5B79" font-size="13" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">cho từng file rồi ghép lại, chính là bản phát hành 0.16.2. Fable không tự viết câu nào.</text>
<text x="32" y="92" fill="#0B0B17" font-size="17" font-weight="600" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Lỗi dấu hai chấm giữa câu mà Vietnamizer giúp từng model phát hiện và sửa</text>
<text x="32" y="114" fill="#5B5B79" font-size="13" font-family="'Space Grotesk', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Bản gốc có 109 chỗ dùng dấu hai chấm nối hai ý trong một câu, kiểu “Khách ít kiên nhẫn: họ sẽ hỏi nơi khác”.</text>
