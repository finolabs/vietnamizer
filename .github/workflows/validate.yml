name: Kiểm tra gói

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Kiểm tra source không track file local bị ignore
        run: |
          tracked_ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$tracked_ignored" ]]; then
            printf 'File local đang được track:\n%s\n' "$tracked_ignored"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Chạy test đóng gói offline
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Kiểm tra metadata và bảng pattern
        run: python3 scripts/validate-package.py
      - name: Kiểm tra cả hai archive phát hành
        run: ./scripts/package-skill.sh
      - name: Kiểm tra metadata và archive plugin ba nền tảng
        run: python3 scripts/package-plugin.py
      - name: Kiểm tra Skills CLI nhận diện skill
        run: npx --yes skills@1.5.20 add . --list
      - name: Kiểm tra plugin Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.287
          claude plugin validate .
          claude plugin validate .claude-plugin/plugin.json --strict
